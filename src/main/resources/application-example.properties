spring.application.name=Credit-card-system
#Server Port 
server.port=8082

#Database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/credit_card_system
spring.datasource.username=postgres
spring.datasource.password=your_db_password

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

#swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=method


#Flyway Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration

#logging.level.org.springframework=DEBUG

jwt.secret=yourSuperSecureSecretKeyThatIsAtLeast32Characters
jwt.expiration=3600000

#Timezone
app.default-timezone=Asia/Kolkata

#Billing 
billing.due-reminder-days=7

#Fie Handling 
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
